name: kanclaude-go

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://kanclaude:kanclaude@postgres:5432/kanclaude
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanclaude
      POSTGRES_PASSWORD: kanclaude
      POSTGRES_DB: kanclaude
    ports:
      # 5433 on the host so it doesn't clash with a local Postgres;
      # the server's default DSN points here for no-Docker development.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanclaude"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
